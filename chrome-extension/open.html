<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>匯入 PDF · 論文伴讀</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card">
  <header><span class="mark">伴</span><span>論文伴讀</span></header>
  <h1>將 PDF 加入你的書庫</h1>
  <p id="filename" class="filename"></p>
  <p id="status" role="status" aria-live="polite">正在連接論文伴讀…</p>
  <div id="recovery" hidden>
    <button id="retry" class="primary">重試</button>
    <div class="file-choice"><label for="file">也可以選擇已下載的 PDF</label><input id="file" type="file" accept="application/pdf,.pdf"></div>
    <button id="settings" class="link">連線設定</button>
  </div>
  <p class="hint">原本的 PDF 分頁會保留。同一份 PDF 已在書庫時，會直接開啟既有文獻。</p>
  <script type="module" src="open.js"></script>
</main></body></html>
